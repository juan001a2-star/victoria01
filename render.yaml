services:
  - type: web
    name: banca-victoria
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banca-victoria-db
          property: connectionString

databases:
  - name: banca-victoria-db
    plan: free
    databaseName: banca_victoria
    user: banca
